{% extends "base.html" %}

{% block title %}Student Login — SmartLearn AI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card card-hover" style="padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 50px; height: 50px; background: var(--primary-light); color: var(--primary); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 1rem;">
                🔑
            </div>
            <h2 style="font-family: var(--font-heading); font-weight: 800; font-size: 1.8rem;">Welcome Back 👋</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Enter your details to access your AI learning dashboard.</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="rahul@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
                Login to SmartLearn AI 🚀
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
            <p style="color: var(--text-secondary); font-size: 0.9rem;">
                Don't have an account yet? <a href="{{ url_for('register') }}" style="font-weight: 700;">Register Free</a>
            </p>
            <div style="margin-top: 1rem;">
                <a href="{{ url_for('demo_mode') }}" class="btn btn-secondary" style="width: 100%; font-size: 0.9rem;">
                    ⚡ Launch 1-Click Demo Mode
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
